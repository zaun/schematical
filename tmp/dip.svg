<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 1300" width="100%" height="100%">
  <defs>
    <!-- Dark Plastic Dual-In-Line Package Surface Gradient -->
    <linearGradient id="bodyGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#121315" />
      <stop offset="4%" stop-color="#282a2e" />
      <stop offset="8%" stop-color="#1f2023" />
      <stop offset="50%" stop-color="#2a2c30" />
      <stop offset="92%" stop-color="#1f2023" />
      <stop offset="96%" stop-color="#282a2e" />
      <stop offset="100%" stop-color="#121315" />
    </linearGradient>

    <!-- Chamfer / Bevel Highlights -->
    <linearGradient id="topBevel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4f5259" />
      <stop offset="100%" stop-color="#1f2023" />
    </linearGradient>

    <linearGradient id="bottomBevel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1f2023" />
      <stop offset="100%" stop-color="#0a0a0b" />
    </linearGradient>

    <!-- Metallic Lead/Pin Gradient -->
    <linearGradient id="pinGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8a9099" />
      <stop offset="20%" stop-color="#e6ecf5" />
      <stop offset="40%" stop-color="#b0b7c2" />
      <stop offset="70%" stop-color="#787e87" />
      <stop offset="90%" stop-color="#d5dce6" />
      <stop offset="100%" stop-color="#5c6169" />
    </linearGradient>

    <!-- Pin Shadow -->
    <filter id="pinShadow" x="-20%" y="-10%" width="140%" height="120%">
      <feDropShadow dx="3" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.6" />
    </filter>

    <!-- Chip Body Shadow -->
    <filter id="bodyShadow" x="-10%" y="-5%" width="120%" height="110%">
      <feDropShadow dx="0" dy="15" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <!-- Left Pin Model -->
    <g id="pin-left">
      <!-- Outer/Wide Shoulder & Lead Frame Bend -->
      <path d="M 0,0 L -35,0 L -35,8 L -20,18 L -20,40 L 0,40 Z" fill="url(#pinGradient)" />
      <!-- Inner Lead Highlights & Details -->
      <line x1="-35" y1="2" x2="0" y2="2" stroke="#ffffff" stroke-opacity="0.4" stroke-width="1" />
      <line x1="-35" y1="8" x2="-20" y2="18" stroke="#000000" stroke-opacity="0.3" stroke-width="1" />
    </g>

    <!-- Right Pin Model -->
    <g id="pin-right">
      <!-- Outer/Wide Shoulder & Lead Frame Bend -->
      <path d="M 0,0 L 35,0 L 35,8 L 20,18 L 20,40 L 0,40 Z" fill="url(#pinGradient)" />
      <!-- Inner Lead Highlights & Details -->
      <line x1="35" y1="2" x2="0" y2="2" stroke="#ffffff" stroke-opacity="0.4" stroke-width="1" />
      <line x1="35" y1="8" x2="20" y2="18" stroke="#000000" stroke-opacity="0.3" stroke-width="1" />
    </g>
  </defs>

  <!-- Background Canvas -->
  <rect width="100%" height="100%" fill="#f4f5f7" />

  <g transform="translate(50, 40)">
    
    <!-- PINS (Drawn behind the body) -->
    <g filter="url(#pinShadow)">
      <!-- Left Side Pins (1 to 20, Top to Bottom) -->
      <use href="#pin-left" x="100" y="80" />
      <use href="#pin-left" x="100" y="135" />
      <use href="#pin-left" x="100" y="190" />
      <use href="#pin-left" x="100" y="245" />
      <use href="#pin-left" x="100" y="300" />
      <use href="#pin-left" x="100" y="355" />
      <use href="#pin-left" x="100" y="410" />
      <use href="#pin-left" x="100" y="465" />
      <use href="#pin-left" x="100" y="520" />
      <use href="#pin-left" x="100" y="575" />
      <use href="#pin-left" x="100" y="630" />
      <use href="#pin-left" x="100" y="685" />
      <use href="#pin-left" x="100" y="740" />
      <use href="#pin-left" x="100" y="795" />
      <use href="#pin-left" x="100" y="850" />
      <use href="#pin-left" x="100" y="905" />
      <use href="#pin-left" x="100" y="960" />
      <use href="#pin-left" x="100" y="1015" />
      <use href="#pin-left" x="100" y="1070" />
      <use href="#pin-left" x="100" y="1125" />

      <!-- Right Side Pins (40 down to 21, Top to Bottom) -->
      <use href="#pin-right" x="300" y="80" />
      <use href="#pin-right" x="300" y="135" />
      <use href="#pin-right" x="300" y="190" />
      <use href="#pin-right" x="300" y="245" />
      <use href="#pin-right" x="300" y="300" />
      <use href="#pin-right" x="300" y="355" />
      <use href="#pin-right" x="300" y="410" />
      <use href="#pin-right" x="300" y="465" />
      <use href="#pin-right" x="300" y="520" />
      <use href="#pin-right" x="300" y="575" />
      <use href="#pin-right" x="300" y="630" />
      <use href="#pin-right" x="300" y="685" />
      <use href="#pin-right" x="300" y="740" />
      <use href="#pin-right" x="300" y="795" />
      <use href="#pin-right" x="300" y="850" />
      <use href="#pin-right" x="300" y="905" />
      <use href="#pin-right" x="300" y="960" />
      <use href="#pin-right" x="300" y="1015" />
      <use href="#pin-right" x="300" y="1070" />
      <use href="#pin-right" x="300" y="1125" />
    </g>

    <!-- MAIN IC BODY -->
    <g filter="url(#bodyShadow)">
      <!-- Base Plastic Body -->
      <rect x="100" y="40" width="200" height="1165" rx="6" ry="6" fill="url(#bodyGradient)" />
      
      <!-- Top / Bottom Bevel Lines for 3D molded effect -->
      <rect x="100" y="40" width="200" height="6" rx="3" ry="3" fill="url(#topBevel)" opacity="0.8" />
      <rect x="100" y="1199" width="200" height="6" rx="3" ry="3" fill="url(#bottomBevel)" opacity="0.9" />

      <!-- Side Mold Lines / Plastic Seams -->
      <line x1="106" y1="40" x2="106" y2="1205" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1" />
      <line x1="294" y1="40" x2="294" y2="1205" stroke="#000000" stroke-opacity="0.3" stroke-width="1" />
    </g>

    <!-- INDEXING FEATURES (Notch & Pin 1 Marker) -->
    <!-- Half-Moon Notch at Top -->
    <path d="M 175,40 A 25,25 0 0,0 225,40 Z" fill="#121315" stroke="#282a2e" stroke-width="2" />
    <path d="M 177,41 A 23,23 0 0,0 223,41" fill="none" stroke="#000000" stroke-opacity="0.7" stroke-width="3" />

    <!-- Pin 1 Indent Dot -->
    <circle cx="130" cy="85" r="10" fill="#18191c" stroke="#101113" stroke-width="2" />
    <circle cx="130" cy="85" r="9" fill="none" stroke="#000000" stroke-opacity="0.6" stroke-width="1.5" />
    <path d="M 123,80 A 7,7 0 0,1 135,88" fill="none" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1.5" />

    <!-- TEXT / CHIP MARKINGS (Laser Etched Style) -->
    <g fill="#a6b0be" opacity="0.75" font-family="Monospace, Arial, sans-serif" text-anchor="middle">
      <!-- Logo / Brand Symbol -->
      <path d="M 185,280 L 200,250 L 215,280 L 205,280 L 200,270 L 195,280 Z" fill="#a6b0be" />
      <circle cx="200" cy="265" r="22" fill="none" stroke="#a6b0be" stroke-width="2" />

      <!-- Chip Part Number -->
      <text x="200" y="340" font-size="22" font-weight="bold" letter-spacing="3">ATMEGA32A</text>
      <text x="200" y="370" font-size="16" letter-spacing="2">-PU</text>

      <!-- Date Code & Batch Info -->
      <text x="200" y="430" font-size="14" letter-spacing="1.5">2422E TW</text>
      <text x="200" y="455" font-size="13" letter-spacing="1">354D9A</text>
    </g>

    <!-- PIN NUMBERING LABELS -->
    <g font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#6b7280">
      <!-- Left side: 1 to 20 -->
      <text x="115" y="104" text-anchor="start">1</text>
      <text x="115" y="159" text-anchor="start">2</text>
      <text x="115" y="214" text-anchor="start">3</text>
      <text x="115" y="269" text-anchor="start">4</text>
      <text x="115" y="324" text-anchor="start">5</text>
      <text x="115" y="379" text-anchor="start">6</text>
      <text x="115" y="434" text-anchor="start">7</text>
      <text x="115" y="489" text-anchor="start">8</text>
      <text x="115" y="544" text-anchor="start">9</text>
      <text x="115" y="599" text-anchor="start">10</text>
      <text x="115" y="654" text-anchor="start">11</text>
      <text x="115" y="709" text-anchor="start">12</text>
      <text x="115" y="764" text-anchor="start">13</text>
      <text x="115" y="819" text-anchor="start">14</text>
      <text x="115" y="874" text-anchor="start">15</text>
      <text x="115" y="929" text-anchor="start">16</text>
      <text x="115" y="984" text-anchor="start">17</text>
      <text x="115" y="1039" text-anchor="start">18</text>
      <text x="115" y="1094" text-anchor="start">19</text>
      <text x="115" y="1149" text-anchor="start">20</text>

      <!-- Right side: 40 down to 21 -->
      <text x="285" y="104" text-anchor="end">40</text>
      <text x="285" y="159" text-anchor="end">39</text>
      <text x="285" y="214" text-anchor="end">38</text>
      <text x="285" y="269" text-anchor="end">37</text>
      <text x="285" y="324" text-anchor="end">36</text>
      <text x="285" y="379" text-anchor="end">35</text>
      <text x="285" y="434" text-anchor="end">34</text>
      <text x="285" y="489" text-anchor="end">33</text>
      <text x="285" y="544" text-anchor="end">32</text>
      <text x="285" y="599" text-anchor="end">31</text>
      <text x="285" y="654" text-anchor="end">30</text>
      <text x="285" y="709" text-anchor="end">29</text>
      <text x="285" y="764" text-anchor="end">28</text>
      <text x="285" y="819" text-anchor="end">27</text>
      <text x="285" y="874" text-anchor="end">26</text>
      <text x="285" y="929" text-anchor="end">25</text>
      <text x="285" y="984" text-anchor="end">24</text>
      <text x="285" y="1039" text-anchor="end">23</text>
      <text x="285" y="1094" text-anchor="end">22</text>
      <text x="285" y="1149" text-anchor="end">21</text>
    </g>
  </g>
</svg>