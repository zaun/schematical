<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2B5FA8"/>
      <stop offset="1" stop-color="#132D57"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.14"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="pin" cx="0.38" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#FFD39A"/>
      <stop offset="1" stop-color="#E07A1F"/>
    </radialGradient>
    <pattern id="grid" x="0" y="0" width="64" height="64" patternUnits="userSpaceOnUse">
      <circle cx="32" cy="32" r="4" fill="#FFFFFF" fill-opacity="0.16"/>
    </pattern>
    <clipPath id="plate"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#06142B" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)" filter="url(#shadow)"/>
  <g clip-path="url(#plate)">
    <rect x="100" y="100" width="824" height="824" fill="url(#grid)"/>
    <rect x="100" y="100" width="824" height="824" fill="url(#gloss)"/>
  </g>
  <rect x="101.5" y="101.5" width="821" height="821" rx="183.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="3"/>

  <g filter="url(#soft)" stroke="#FFFFFF" stroke-width="36" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- input and output wires -->
    <path d="M232 416 H392 M232 608 H392 M680 512 H792"/>
    <!-- AND gate body -->
    <path d="M392 320 H488 A192 192 0 0 1 488 704 H392 Z" fill="#FFFFFF" fill-opacity="0.1"/>
  </g>
  <!-- pins -->
  <g fill="url(#pin)" stroke="#FFFFFF" stroke-width="10">
    <circle cx="232" cy="416" r="34"/>
    <circle cx="232" cy="608" r="34"/>
    <circle cx="792" cy="512" r="34"/>
  </g>
</svg>
